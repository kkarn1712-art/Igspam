services:
  - type: web
    name: pratik-panel
    runtime: python
    repo: https://github.com/kkarn1712-art/Igspam
    branch: main
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k eventlet -w 1 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
